name: CI
on:
  push: { branches: [main, faster-kernels] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check (engine, tests, benchmarks)
        run: |
          for f in engine/*.js tests/*.js benchmarks/*.js; do node --check "$f"; done
      - name: Unit tests (no GPU)
        run: deno test --allow-read tests/unit
      - name: Kernel generator sanity
        run: deno run --allow-read tests/unit/generator_smoke.js
